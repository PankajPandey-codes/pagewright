name: Release

# Pushing a tag like v1.0.0 builds self-contained apps (each bundles its own Java runtime) and attaches
# them to a GitHub release. Not yet run: check the first release build and adjust if a step fails.
on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macos-apple-silicon
          - os: macos-15-intel
            label: macos-intel
          - os: windows-latest
            label: windows
          - os: ubuntu-latest
            label: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build macOS app
        if: startsWith(matrix.os, 'macos')
        run: |
          packaging/build-mac.sh dmg
          mkdir -p out
          mv dist/*.dmg "out/Pagewright-${{ matrix.label }}.dmg"

      - name: Build Windows app
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          ./mvnw -q package
          mkdir -p target/input dist out
          cp target/pagewright.jar target/input/
          jpackage --type app-image --name "Pagewright" --input target/input --main-jar pagewright.jar \
            --main-class pagewright.App --dest dist --java-options "-Xmx2g" \
            --add-modules java.desktop,java.logging,java.xml,java.naming,jdk.unsupported
          cd dist && 7z a "../out/Pagewright-windows.zip" "Pagewright"

      - name: Build Linux app
        if: matrix.os == 'ubuntu-latest'
        run: |
          ./mvnw -q package
          mkdir -p target/input dist out
          cp target/pagewright.jar target/input/
          jpackage --type app-image --name "Pagewright" --input target/input --main-jar pagewright.jar \
            --main-class pagewright.App --dest dist --icon src/main/resources/icon.png --java-options "-Xmx2g" \
            --add-modules java.desktop,java.logging,java.xml,java.naming,jdk.unsupported
          tar -czf out/Pagewright-linux.tar.gz -C dist "Pagewright"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: out/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
